[package]
name = "veriv-toolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "TOML-driven command and network verification runner"
license = "MIT"
repository = "https://github.com/WaannAlter/veriv-toolkit"
readme = "README.md"

[dependencies]
command-group = "=5.0.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "=1.1.5"

[profile.release]
strip = true
